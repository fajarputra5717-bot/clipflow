server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads (thumbnails, watermarks) and long AI calls
    client_max_body_size 64m;

    # Re-resolve the backend on every request (valid=10s). A fixed
    # proxy_pass host is resolved once at nginx start; when the backend
    # container is recreated it gets a new IP and nginx keeps hitting the
    # old one -> "HTTP 502". This was a real outage before.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8000;

    location /api/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 138: the host[:port] exactly as the browser sent it ($server_port is the container's 80) for the Origin check
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Connection "";
        proxy_buffering off;              # lets SSE stream if it's added later
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # Audit M6: while a deploy recreates the backend, nginx can't connect (502) or times out (504). Answer a JSON 503
        # with Retry-After instead of nginx's HTML page: the app's GETs wait it out (index.html fetchThroughDeploy) and
        # anything that still fails reads "ClipFlow is updating…".
        error_page 502 504 = @backend_updating;
    }
    location @backend_updating {
        default_type application/json;
        add_header Retry-After 5 always;
        add_header Cache-Control "no-store" always;
        return 503 '{"detail":"ClipFlow is updating… try again in a minute."}';
    }

    location = /health {
        proxy_pass $backend_upstream;
    }

    # Caption display fonts (R-19): worker/fonts mounted read-only at
    # /usr/share/nginx/fonts by compose. Static and public (SIL OFL).
    # 168: shared UI tokens (shared/ui/tokens.css), one file for every page.
    location /ui/ {
        alias /usr/share/nginx/ui/;
        add_header Cache-Control "no-cache";
    }

    location /fonts/ {
        alias /usr/share/nginx/fonts/;
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
