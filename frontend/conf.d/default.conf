server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads (thumbnails, watermarks) and long AI calls
    client_max_body_size 64m;

    # Re-resolve the backend on every request (valid=10s). A fixed
    # proxy_pass host is resolved once at nginx start; when the backend
    # container is recreated it gets a new IP and nginx keeps hitting the
    # old one -> "HTTP 502". This was a real outage before.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8000;

    location /api/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 138: the host[:port] exactly as the browser sent it ($server_port is the container's 80) for the Origin check
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Connection "";
        proxy_buffering off;              # lets SSE stream if it's added later
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /health {
        proxy_pass $backend_upstream;
    }

    # Caption display fonts (R-19): worker/fonts mounted read-only at
    # /usr/share/nginx/fonts by compose. Static and public (SIL OFL).
    location /fonts/ {
        alias /usr/share/nginx/fonts/;
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
