# Staging stack for lane-b (editor work). Separate project: containers/volumes/network are all
# clipflow-staging_*; production riftstorm-* is never touched. Start/stop/reset: scripts/staging.sh
# (docs/staging.md). Production /data is mounted READ-ONLY at /data (absolute DB paths keep working);
# every write goes to DATA_ROOT=/data-staging.
name: clipflow-staging

x-app-env: &app-env
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  DATA_ROOT: /data-staging
  TZ: ${TZ:-Asia/Jakarta}
  PYTHONUNBUFFERED: "1"
  CLIPFLOW_ENV: staging
  # never delete anything from staging sweeps (and /data is read-only anyway)
  ORPHAN_SWEEP_DRY_RUN: "true"
  RETENTION_DAYS_INTERMEDIATE: "36500"

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "2" }

services:
  postgres:
    image: postgres:17-alpine
    restart: "no"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ:-Asia/Jakarta}
    volumes:
      - staging_pg:/var/lib/postgresql/data      # its OWN volume, restored from /data/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 5s
      retries: 30
    logging: *logging

  backend:
    build: { context: ./backend, additional_contexts: { shared: ./shared } }
    restart: "no"
    env_file: .env.staging
    environment: *app-env
    volumes:
      - /data:/data:ro
      - /data-staging:/data-staging
      - ./docs/campaigns:/app/campaigns:ro
    ports: ["127.0.0.1:8001:8000"]
    # mirrors main 143: /health is 503 until ensure_schema() has run; the worker waits for it
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    depends_on: { postgres: { condition: service_healthy } }
    logging: *logging

  worker:
    build: { context: ./worker, additional_contexts: { shared: ./shared } }
    restart: "no"
    env_file: .env.staging
    environment:
      <<: *app-env
      HF_HOME: /cache/huggingface
      HF_HUB_OFFLINE: "1"                         # cache is mounted read-only
    cpus: 2
    volumes:
      - /data:/data:ro
      - /data-staging:/data-staging
      - hf_cache:/cache/huggingface:ro
      - ./docs/campaigns:/app/campaigns:ro
    depends_on:
      postgres: { condition: service_healthy }
      backend: { condition: service_healthy }   # main 143
    logging: *logging

  frontend:
    image: nginx:1.27-alpine
    restart: "no"
    ports: ["8080:80"]
    volumes:
      - ./frontend/html:/usr/share/nginx/html:ro
      - ./frontend/conf.d:/etc/nginx/conf.d:ro
      - ./worker/fonts:/usr/share/nginx/fonts:ro
      - ./shared/ui:/usr/share/nginx/ui:ro      # 168: /ui/tokens.css (same mount as production)
    depends_on: [backend]
    logging: *logging

volumes:
  staging_pg:
  hf_cache:
    external: true
    name: riftstorm_hf_cache                      # Whisper models, mounted :ro above
