# ClipFlow / Riftstorm — rebuilt 2026-09-26.
# Project name is pinned so volumes are named riftstorm_* (backup scripts
# and the runbook rely on that).
name: riftstorm

x-app-env: &app-env
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  DATA_ROOT: /data
  TZ: ${TZ:-Asia/Jakarta}
  PYTHONUNBUFFERED: "1"

x-logging: &logging
  driver: json-file
  options: { max-size: "20m", max-file: "3" }

services:
  postgres:
    image: postgres:17-alpine
    container_name: riftstorm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ:-Asia/Jakarta}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging

  backend:
    build:
      context: ./backend
      additional_contexts:
        shared: ./shared
    container_name: riftstorm-backend
    restart: unless-stopped
    env_file: .env
    environment: *app-env
    volumes:
      - /data:/data
      - ./docs/campaigns:/app/campaigns:ro   # campaign rules (081), re-read on change
    ports:
      - "127.0.0.1:8000:8000"   # debugging from the VM only; the UI goes through nginx
    # 143: healthy only after ensure_schema() created every table (/health is 503 until then);
    # worker + notifier wait for it, so a deploy can't start them against a half-migrated DB.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    depends_on:
      postgres: { condition: service_healthy }
    logging: *logging

  worker:
    build:
      context: ./worker
      additional_contexts:
        shared: ./shared
    container_name: riftstorm-worker
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *app-env
      # faster-whisper models come from the Hugging Face hub; the cache
      # lives in a named volume so image rebuilds don't redownload (R-07).
      HF_HOME: /cache/huggingface
      TELEGRAM_SENDER: separate   # 148: Telegram sends + reminders run in `sender`, never behind a long render
    volumes:
      - /data:/data
      - hf_cache:/cache/huggingface
      - ./docs/campaigns:/app/campaigns:ro   # campaign rules (081), re-read on change
      - ./secrets:/run/secrets/clipflow:ro    # 167: optional youtube-cookies.txt (gitignored), bot-check retry only
    depends_on:
      postgres: { condition: service_healthy }
      backend: { condition: service_healthy }   # 143: schema migrated first
      pot: { condition: service_started }
    logging: *logging

  # 167: bgutil PO-token provider for yt-dlp (YouTube bot check). Internal only, no published port.
  # Pinned; bump together with the worker's bgutil-ytdlp-pot-provider version.
  pot:
    image: brainicism/bgutil-ytdlp-pot-provider:2.0.2
    container_name: riftstorm-pot
    restart: unless-stopped
    logging: *logging

  # P2.5 S4 (148): the worker image in Telegram-only mode: send-to-phone queue + planned-post reminders.
  sender:
    build:
      context: ./worker
      additional_contexts:
        shared: ./shared
    container_name: riftstorm-sender
    restart: unless-stopped
    command: ["python", "-u", "/app/worker.py", "--telegram-only"]
    env_file: .env
    environment:
      <<: *app-env
    volumes:
      - /data:/data                           # finals to send; shrunk copies in /data/telegram
      - ./docs/campaigns:/app/campaigns:ro
    depends_on:
      postgres: { condition: service_healthy }
      backend: { condition: service_healthy }
    logging: *logging

  frontend:
    image: nginx:1.27-alpine
    container_name: riftstorm-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    # Directory mounts, NOT single-file mounts: editors write atomically
    # (new inode), which silently detaches a single-file bind mount.
    volumes:
      - ./frontend/html:/usr/share/nginx/html:ro
      - ./frontend/conf.d:/etc/nginx/conf.d:ro
      # Caption fonts for the edit panel's preview/dropdown (R-19): the
      # same OFL files the worker renders with, not a second copy.
      # Outside the read-only html root (a nested mountpoint can't be
      # created there); served by `location /fonts/` in default.conf.
      - ./worker/fonts:/usr/share/nginx/fonts:ro
    depends_on:
      - backend
    logging: *logging

  # Outbound-only Telegram alerts (change 066). One-time on the host:
  #   mkdir -p /data/notifier && chown 10001:10001 /data/notifier && chmod 700 /data/notifier
  notifier:
    build:
      context: ./notifier
      additional_contexts:
        shared: ./shared                # 142: per-user digest uses shared/digest.py
    container_name: riftstorm-notifier
    restart: unless-stopped
    environment:
      <<: *app-env                      # DATABASE_URL, DATA_ROOT, TZ
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      BACKEND_HEALTH_URL: http://backend:8000/health
      DISK_ALERT_PCT: ${DISK_ALERT_PCT:-15}
      # POLL_SECONDS: 30   MAX_PER_HOUR: 20   SUMMARY_HOUR: 8 (WIB)
    volumes:
      - /data:/data:ro                  # disk-free check only
      - /data/notifier:/data/notifier   # state.json (dedupe), the only writable path
      - ./docs/campaigns:/app/campaigns:ro  # 142: campaign rules for the digest (weeks, payouts)
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy   # 143: reads tables the backend migrates
    logging: *logging

  # Optional automation. Start with: docker compose --profile n8n up -d
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: riftstorm-n8n
    profiles: ["n8n"]
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Jakarta}
      GENERIC_TIMEZONE: ${TZ:-Asia/Jakarta}
      N8N_SECURE_COOKIE: "false"   # LAN-only, no HTTPS
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    logging: *logging

volumes:
  postgres_data:
  hf_cache:
  n8n_data:
